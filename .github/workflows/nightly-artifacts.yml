name: Nightly Artifacts

env:
  MOG_GIT_REF: b64a7eb388f2fda66e014ffcc3d88635e914c694

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  publication-artifacts:
    name: Publication artifact smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install -e '.[demo,dev]'

      - name: Build ncpu_metal Rust extension
        run: |
          pip install 'maturin>=1.0,<2.0'
          maturin develop --release --manifest-path kernels/rust_metal/Cargo.toml

      - name: Quick release verification
        run: ./scripts/release/release_check.sh --quick

      - name: Generate publication artifacts
        run: ./scripts/release/paper_artifacts.sh --quick --skip-mog-bootstrap --output-dir paper/generated/nightly

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publication-artifacts-nightly
          path: paper/generated/nightly
          if-no-files-found: error
