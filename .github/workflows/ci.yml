name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (cargo check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: kernels/rust_metal
        run: cargo check --bin ncpu_run

      # Note: cargo test requires either Python dev headers (for PyO3 linking)
      # or Metal GPU hardware (for GPU tests). Neither is reliably available
      # in CI. cargo check verifies compilation; tests run locally.

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e '.[demo,dev]'

      - name: Run core tests
        run: |
          pytest tests/ -x -q \
            --ignore=tests/test_execution_training.py \
            --ignore=tests/test_api_server_buffered_inference.py \
            --ignore=tests/test_rust_cutover.py \
            --ignore=tests/test_resume_bigcodebench_benchmark.py \
            --ignore=tests/test_llm_provider.py \
            --ignore=tests/test_differentiable_integration.py \
            --ignore=tests/test_muxleq.py \
            -k "not metal and not gpu and not rust"

      - name: Run differentiable engine tests
        run: pytest ncpu/differentiable/ -x -q
