name: CI

env:
  MOG_GIT_REF: b64a7eb388f2fda66e014ffcc3d88635e914c694

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (cargo check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: kernels/rust_metal
        run: cargo check --bin ncpu_run

      # Note: cargo test requires either Python dev headers (for PyO3 linking)
      # or Metal GPU hardware (for GPU tests). Neither is reliably available
      # in CI. cargo check verifies compilation; tests run locally.

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap Mog toolchain
        run: ./scripts/bootstrap_mog_toolchain.sh

      - name: Install dependencies
        run: pip install -e '.[demo,dev]'

      - name: Environment doctor
        run: python -m ncpu doctor

      - name: Run core tests
        run: |
          pytest tests/ -q \
            --ignore=tests/differentiable/test_execution_training.py \
            --ignore=tests/self_optimizing/test_api_server_buffered_inference.py \
            --ignore=tests/gpu/test_rust_cutover.py \
            --ignore=tests/self_optimizing/test_resume_bigcodebench_benchmark.py \
            --ignore=tests/self_optimizing/test_llm_provider.py \
            --ignore=tests/self_optimizing/test_differentiable_integration.py \
            --ignore=tests/gpu/test_muxleq.py \
            -k "not metal and not gpu and not rust"

      - name: Run differentiable engine tests
        run: pytest tests/differentiable/test_differentiable.py tests/differentiable/test_differentiable_advanced.py -x -q

  self_improvement_gate:
    name: Self-improvement gate (nsynth cross-run learning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nsynth/target
          key: nsynth-gate-${{ runner.os }}-${{ hashFiles('nsynth/Cargo.lock', 'nsynth/Cargo.toml') }}

      - name: Build release binaries
        working-directory: nsynth
        # Only the two binaries the gate needs; keeps cold build under a minute
        # on the GitHub runner and skips the long-tail deps the full workspace
        # pulls in for other bins.
        run: cargo build --release --bin transfer_curve --bin curve_analysis

      - name: Run self-improvement gate
        # Isolated cache + weights paths so the gate's synthetic run never
        # touches real user artifacts, and so parallel CI runs don't fight.
        env:
          NSYNTH_CACHE_PATH: /tmp/nsynth_ci_gate_cache.json
          NSYNTH_META_WEIGHTS_PATH: /tmp/nsynth_ci_gate_weights.tsv
          NSYNTH_TEACHER_BUDGET_SEC: "8"
        run: tools/ci_self_improvement_gate.sh --limit 15
