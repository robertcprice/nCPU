name: NPCoT bench gate

# Runs the CPU-only NPCoT self-consistency benchmark on every PR that
# touches library or reduction-head code. Fails if pass@1 drops below the
# established floor — catching library regressions before they merge.

on:
  pull_request:
    paths:
      - "ncpu/self_optimizing/array_**"
      - "ncpu/self_optimizing/program_library_session.py"
      - "ncpu/self_optimizing/program_verifier.py"
      - "ncpu/self_optimizing/compliance_report.py"
      - "ncpu/self_optimizing/library_**"
      - "benchmarks/benchmark_npcot_coding_bench.py"
      - ".github/workflows/npcot-bench-gate.yml"
  workflow_dispatch:

jobs:
  npcot-bench:
    name: Library pass@1 regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PASS_AT_1_FLOOR: "0.55"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pytest hypothesis

      - name: Run NPCoT self-consistency benchmark
        id: bench
        run: |
          mkdir -p artifacts
          python3 -m benchmarks.benchmark_npcot_coding_bench \
            --n-problems 200 \
            --json artifacts/npcot_bench3_ci.json
          python3 -c "
          import json, sys
          data = json.load(open('artifacts/npcot_bench3_ci.json'))
          npcot = data['results']['npcot_library']['pass_at_1']
          floor = float('${{ env.PASS_AT_1_FLOOR }}')
          print(f'NPCoT pass@1 = {npcot:.3f} (floor {floor})')
          if npcot < floor:
              print('::error::Library regressed below pass@1 floor', file=sys.stderr)
              sys.exit(1)
          "

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npcot_bench_report
          path: artifacts/npcot_bench3_ci.json
