name: Auto-distill weekly

# Weekly cron: export the LLM solution cache as a training dataset,
# provision a vast.ai A100, LoRA-fine-tune Qwen3.5-4B-Instruct on it,
# pull the adapter back, commit to artifacts/adapters/.
#
# The LLM solution cache grows from production usage (via MCP tool
# cache_solution calls or direct hybrid-runner writes). Every week we
# re-distill, closing the loop: the system's own successful solves
# teach the next generation of its local model.
#
# Requires repo secrets:
#   - VAST_API_KEY
#   - ANTHROPIC_API_KEY
#   - VAST_SSH_PRIVATE_KEY  (base64-encoded ed25519 private key
#     whose public half is registered with vast.ai)
#
# Cost-bounded: the distill-9b target is ~$1.50/hr × 2 hours = ~$3.
# Skip-if-cache-small guards in auto_distill.sh mean a quiet week
# doesn't spend anything.

on:
  schedule:
    - cron: "0 10 * * 1"  # Mondays 10:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-distill-weekly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  distill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          pip install vastai anthropic datasets

      - name: Restore SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VAST_SSH_PRIVATE_KEY }}" | base64 -d \
            > ~/.ssh/vast_ed25519
          chmod 600 ~/.ssh/vast_ed25519
          # Tell subprocesses to use this key.
          cat >> ~/.ssh/config <<EOF
          Host *
            IdentityFile ~/.ssh/vast_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Run auto-distill
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use a committed cache path so runs share state week-over-week.
          # The cache starts empty and grows via other CI jobs' writes.
          NSYNTH_LLM_CACHE_PATH: artifacts/shared_llm_cache.tsv
        run: tools/distillation/auto_distill.sh

      - name: Commit adapter + dataset
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/adapters/ artifacts/distillation_dataset.jsonl 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(distill): weekly auto-distillation run"
            git push origin HEAD:main
          else
            echo "[distill-cron] no changes to commit this week"
          fi
