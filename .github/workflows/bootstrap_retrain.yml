name: Bootstrap retrain

# Check every 6 hours whether the solved cache has grown enough to warrant
# re-running bootstrap_train. The check is cheap (reads a marker file);
# the retraining runs only when the marker is present.
#
# Commits the updated meta_weights_history.tsv back to main so the
# trajectory dataset records every retrain event with its timestamp.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: bootstrap-retrain
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nsynth/target
          key: nsynth-retrain-${{ runner.os }}-${{ hashFiles('nsynth/Cargo.lock', 'nsynth/Cargo.toml') }}

      - name: Build required binaries
        working-directory: nsynth
        run: cargo build --release --bin bootstrap_train --bin weights_snapshot

      - name: Conditional retrain
        # Isolated cache + weights + state paths so the CI run never
        # touches user artifacts. The cache and weights files live in
        # /tmp; the marker state survives within this job only.
        env:
          NSYNTH_CACHE_PATH: /tmp/nsynth_retrain_cache.json
          NSYNTH_META_WEIGHTS_PATH: /tmp/nsynth_retrain_weights.tsv
          NSYNTH_BOOTSTRAP_STATE_PATH: /tmp/nsynth_retrain_state.tsv
          NSYNTH_BOOTSTRAP_MARKER_PATH: /tmp/nsynth_retrain_marker
        run: tools/bootstrap_retrain_cron.sh

      - name: Commit any weight-history update
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet artifacts/meta_weights_history.tsv; then
            git add artifacts/meta_weights_history.tsv
            git commit -m "chore(metrics): bootstrap retrain weight snapshot"
            git push origin HEAD:main
          else
            echo "[retrain] no weight change; skipping commit"
          fi
