name: Publication Verification

env:
  MOG_GIT_REF: b64a7eb388f2fda66e014ffcc3d88635e914c694

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Benchmark trials to run for publication verification"
        required: true
        default: "5"
      baseline_dir:
        description: "Optional baseline artifact directory within the checkout"
        required: false
        default: ""
      paper_path:
        description: "Paper markdown file to verify"
        required: true
        default: "paper/ncpu_paper.md"
      strict_compare:
        description: "Fail when baseline comparison finds regressions"
        required: true
        default: true
        type: boolean

jobs:
  verify-publication:
    name: Publication verification
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install -e '.[demo,dev]'

      - name: Build ncpu_metal Rust extension
        run: |
          pip install 'maturin>=1.0,<2.0'
          maturin develop --release --manifest-path kernels/rust_metal/Cargo.toml

      - name: Quick release verification
        run: ./scripts/release/release_check.sh --quick

      - name: Run publication artifact verification
        env:
          INPUT_TRIALS: ${{ inputs.trials }}
          INPUT_BASELINE_DIR: ${{ inputs.baseline_dir }}
          INPUT_PAPER_PATH: ${{ inputs.paper_path }}
          INPUT_STRICT_COMPARE: ${{ inputs.strict_compare }}
        run: |
          args=(
            --skip-mog-bootstrap
            --trials "$INPUT_TRIALS"
            --output-dir paper/generated/publication-verify
            --verify-paper-claims
            --paper-path "$INPUT_PAPER_PATH"
            --build-paper-pdf
            --build-submission-bundle
          )

          if [[ -n "$INPUT_BASELINE_DIR" ]]; then
            args+=(--baseline-dir "$INPUT_BASELINE_DIR")
            if [[ "$INPUT_STRICT_COMPARE" == "true" ]]; then
              args+=(--strict-compare)
            else
              args+=(--informational-compare)
            fi
          fi

          ./scripts/release/paper_artifacts.sh "${args[@]}"

      - name: Upload publication verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification
          path: paper/generated/publication-verify
          if-no-files-found: error
