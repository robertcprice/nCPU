[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncpu"
version = "0.2.0"
description = "Neural CPU: every CPU component replaced by trained neural networks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Robert Price"}]

dependencies = []

[project.scripts]
ncpu = "ncpu.__main__:main"
ncpu-lab = "ncpu.lab:main"

[project.optional-dependencies]
demo = [
    "torch>=2.4.0",
    "torchvision>=0.20.1",
    "numpy",
    "tqdm>=4.66.0",
]
neural = [
    "torch>=2.4.0",
    "torchvision>=0.20.1",
    "numpy",
    "tqdm>=4.66.0",
]
model = [
    "torch>=2.4.0",
    "torchvision>=0.20.1",
    "transformers>=5.3.0",
    "peft>=0.6.0",
    "tqdm>=4.66.0",
]
tensor = [
    "torch>=2.4.0",
    "torchvision>=0.20.1",
    "numpy",
]
train = [
    "torch>=2.4.0",
    "torchvision>=0.20.1",
    "transformers>=5.3.0",
    "peft>=0.6.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "tqdm>=4.66.0",
]
full = [
    "torch>=2.4.0",
    "torchvision>=0.20.1",
    "numpy",
    "transformers>=5.3.0",
    "peft>=0.6.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "tqdm>=4.66.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
include = ["ncpu*"]
