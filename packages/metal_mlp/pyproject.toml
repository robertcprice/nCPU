[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-mlp"
version = "0.1.0"
description = "Deploy trained PyTorch MLPs on Apple Silicon Metal GPU without PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Robert Price"}]
keywords = ["metal", "gpu", "mlp", "inference", "apple-silicon", "pytorch-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0", "torch>=2.0"]

[project.urls]
Homepage = "https://github.com/nCPU/metal-mlp"
Repository = "https://github.com/nCPU/metal-mlp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metal_mlp = ["py.typed"]
