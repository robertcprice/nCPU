[package]
name = "mog_synth"
version = "0.1.0"
edition = "2021"

[lib]
name = "mog_synth"
path = "src/lib.rs"
# rlib for Rust consumers; cdylib + staticlib expose the C ABI in src/ffi.rs.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
