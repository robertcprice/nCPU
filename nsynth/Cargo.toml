[package]
name = "mog_synth"
version = "0.1.0"
edition = "2021"

[lib]
name = "mog_synth"
path = "src/lib.rs"
# rlib for Rust consumers; cdylib + staticlib expose the C ABI in src/ffi.rs.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
nl = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
libc = "0.2"
base64-simd = "0.8"
percent-encoding = "2.3"
rs-wat2wasm = "0.1.0"
wat = "1.252.0"
rand = "0.8"
rand_distr = "0.4"
num_cpus = "1.16"
linguigenesis-core = { path = "../../linguigenesis/rust/linguigenesis-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
petgraph = "0.6"
log = "0.4"
prometheus-client = "0.25.0"
